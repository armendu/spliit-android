# 4g is what the Kotlin and AGP workers want on a three-module build; the default 512m metaspace
# runs out once the Compose compiler plugin is in the mix.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official
