# Cutting a release: a tag in, a downloadable APK out.
#
# Trigger it by pushing an annotated tag whose name is `v` plus the version in
# gradle/libs.versions.toml. The job below refuses to build if those two disagree, because the
# failure it prevents is silent: a release page saying v0.2.0 whose APK reports 0.1.0.
#
# `workflow_dispatch` is here for re-running a release whose upload failed after the build
# succeeded. It builds from whatever ref you choose and does not create a release; the APK comes
# out as a workflow artifact instead.
#
# Actions are pinned to commit SHAs rather than to tags. A tag is mutable, so `@v4` is a promise
# that whoever owns the action can rewrite, and this workflow holds a signing key.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Creating a release.
  contents: write
  # The two below are what `attest-build-provenance` needs to sign the attestation: an OIDC
  # token identifying this workflow run, and permission to record the result.
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Identical to ci.yml's, and for the same reasons: see the long note there about why the
      # platform is installed explicitly and why cmdline-tools is pinned.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Verify the SDK has the platform this project compiles against
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.1" || {
            echo "::error::android-37.1 was not installed."
            exit 1
          }

      - name: Read the version the build will stamp
        id: version
        run: |
          version=$(grep -E '^appVersionName = ' gradle/libs.versions.toml | cut -d'"' -f2)
          code=$(grep -E '^appVersionCode = ' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ] || [ -z "$code" ]; then
            echo "::error::Could not read appVersionName/appVersionCode from gradle/libs.versions.toml"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check the tag and the version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          expected="v${{ steps.version.outputs.name }}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag $tag does not match the app version ($expected). Update"
            echo "::error::appVersionName in gradle/libs.versions.toml, or retag."
            exit 1
          fi

      # A release is the one build where "it was green on main" is not good enough.
      - run: make test
      - run: make lint

      # Present only when the four secrets are configured. Absent, the build falls back to the
      # debug key, and the release notes say so.
      - name: Decode the signing keystore, if one is configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLIIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SPLIIT_KEYSTORE_BASE64 secret; this APK will carry the debug key."
          fi

      - name: Assemble the release APK
        env:
          SPLIIT_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SPLIIT_KEYSTORE_PASSWORD: ${{ secrets.SPLIIT_KEYSTORE_PASSWORD }}
          SPLIIT_KEY_ALIAS: ${{ secrets.SPLIIT_KEY_ALIAS }}
          SPLIIT_KEY_PASSWORD: ${{ secrets.SPLIIT_KEY_PASSWORD }}
        run: make apk-release

      # One APK, not one per ABI. Splits pay off when an app bundles large native libraries,
      # which is why Mihon and Seal use them. Measured here: the only `.so` files come from
      # AndroidX and total 73 KB across all four ABIs of a 10 MB APK, so a split would ask people
      # to pick between five downloads to save half a percent. Revisit if that ratio changes.
      - name: Name the APK after the version, and check it
        id: apk
        run: |
          set -e
          out="spliit-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 < "$out.sha256")" >> "$GITHUB_OUTPUT"

      # Lets anyone verify this APK was built by this workflow, from this repository, at this
      # commit: `gh attestation verify spliit-<version>.apk --repo armendu/spliit-android`.
      # A checksum only says a file is unchanged; this says where it came from.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      # Always uploaded, tag or not, which is what makes a manual run useful.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apk.outputs.path }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error

      # `gh` rather than a third-party release action: it is already on the runner, and there is
      # nothing here one command does not do.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -e
          notes="$RUNNER_TEMP/notes.md"

          # What changed, from the per-version changelog if this release has one. The path is
          # F-Droid's own convention (fastlane/metadata/android/en-US/changelogs/<versionCode>),
          # so the same file serves a future F-Droid listing and this release page, and is
          # written by a person rather than derived from commit subjects.
          changelog="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if [ -f "$changelog" ]; then
            cat "$changelog" >> "$notes"
            printf '\n\n' >> "$notes"
          fi

          {
            echo "### Install"
            echo
            echo "Download \`$APK\` below and open it on the device. Android will ask you to"
            echo "allow installing from this source the first time."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> [!WARNING]"
              echo "> This build is signed with a debug key. It installs and runs, but Android"
              echo "> identifies an app by its signature, so it cannot upgrade a copy installed"
              echo "> from a differently-signed build: uninstall the old one first. Set the"
              echo "> \`SPLIIT_KEYSTORE_*\` repository secrets to publish properly signed releases."
              echo
            fi
            echo "### Verify"
            echo
            echo '```sh'
            echo "sha256sum -c $APK.sha256"
            echo "gh attestation verify $APK --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "SHA-256: \`$SHA256\`"
          } >> "$notes"

          gh release create "${GITHUB_REF#refs/tags/}" \
            "$APK" "$APK.sha256" \
            --title "Spliit for Android $VERSION" \
            --notes-file "$notes" \
            --latest
