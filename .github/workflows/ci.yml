name: CI

# Master and pull requests only.
#
# `push:` with no filter meant every branch and every tag, so work in progress burned a full
# build on each commit and a tag ran CI twice, once here and once inside the release workflow,
# which runs the same suites itself. Day-to-day work happens on `development`, and what matters
# about a commit there is whether it survives the pull request into master, which the
# `pull_request` trigger below still covers.
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # 04:15 UTC daily, for the upstream-drift job below.
    - cron: '15 4 * * *'

# Actions are pinned to commit SHAs, not tags: a tag is mutable, so `@v4` is a promise the
# action's owner can rewrite under us. The trailing comment is the human-readable version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Nothing here needs a device: :api and :core are plain Kotlin/JVM and :app only has to
    # assemble. That is what keeps this job in minutes rather than tens of them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle distribution, the dependency cache and the build cache, and writes
      # them back only from the default branch so a pull request cannot poison them.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The Android SDK, provisioned explicitly rather than trusted to the runner image.
      #
      # This project compiles against `android-37.1`, the platform with a MINOR version, which
      # is what `compileSdk = 37` + `compileSdkMinor = 1` in app/build.gradle.kts resolves to.
      # Two things make that more delicate than a normal SDK install:
      #
      #  1. The platform is weeks old and is not on the runner image. It has to be installed.
      #
      #  2. Minor-versioned packages need cmdline-tools >= 20.0 to be parsed correctly. The
      #     ubuntu-24.04 image ships 12.0, which does not merely fail, it mis-parses the
      #     version and carries on, which is the silent-wrong-answer failure this repo keeps a
      #     list of. Hence pinning the tools version below rather than taking the default; the
      #     action's default is 20.0 today, and this pin is what stops that drifting under us.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 14742923 # 20.0, the first release that parses Major.Minor
          packages: 'platform-tools platforms;android-37.1 build-tools;37.0.0'
          accept-android-sdk-licenses: 'true'

      # The installer exits 0 even when it resolved nothing, "Package not found" is printed to
      # stdout and the shell sees success. Verified locally against the current CLI. So assert
      # the platform is actually on disk; without this, a missing platform surfaces much later
      # as a confusing AGP error about compileSdk instead of as a failed setup step.
      - name: Verify the SDK has the platform this project compiles against
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.1" || {
            echo "::error::android-37.1 was not installed. Available platforms:"
            ls -1 "$ANDROID_HOME/platforms" || true
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/37.0.0" || {
            echo "::error::build-tools 37.0.0 was not installed."
            exit 1
          }

      - run: make test
      - run: make build
      - run: make lint

      # Every build's APK, downloadable from the run's own page for as long as GitHub keeps
      # it. This is the "latest build" answer for anyone who wants to try a change before it is
      # tagged, a tagged release (see release.yml) is the durable one.
      #
      # The *debug* APK, deliberately: it is what `make build` already produced a step ago, so
      # this costs nothing, and a debug build is what somebody testing an unreleased change
      # should be running anyway. Note GitHub wraps artifacts in a zip, so this downloads as
      # spliit-debug-<sha>.zip with the APK inside.
      - name: Upload this build's APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spliit-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # The one thing worth keeping when a build fails: which test, and what it expected.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-reports
          path: |
            api/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Why this job exists, and why it is separate.
  #
  # The `build` job runs against a pinned server image, which is what makes it reproducible -
  # and is exactly why it cannot catch the failure this project has already been bitten by
  # once: upstream renaming a tRPC procedure. `groups.stats.get` became `groups.stats.overview`,
  # every pinned test stayed green, and the app shipped a polite, wrong "this server has no
  # totals" to everyone on spliit.app.
  #
  # Only a job pointed at the real, current server can see that coming. It runs nightly rather
  # than per-push because it is watching someone else's deploy schedule, not ours.
  #
  # `make test-live` carries ApiContractDriftTest, which is the part that answers *what*
  # changed rather than merely that something did: it compares the shape of every live response
  # against the recorded fixture and names each field that appeared, vanished or changed type.
  # Read the failure message itself, it is written to be the whole report.
  upstream-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A red mark here is a signal to go and look, not a broken build. spliit.app being briefly
    # down is not a defect in this repo, and a job that cries wolf gets muted.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - run: make test-live BASE_URL=https://spliit.app/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: upstream-drift-reports
          path: api/build/reports/tests/
          if-no-files-found: ignore
