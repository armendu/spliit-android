# The single place a version number is written down.
#
# Nothing else in the build declares one — not a build script, not a dependency line. If you
# find yourself typing a version anywhere but here, the answer is an alias here instead. That
# is what makes "what are we on?" a question with one answer, and an upgrade a one-line diff.

[versions]
# Toolchain. See CLAUDE.md for what constrains what: AGP 9.4 wants Gradle >= 9.6 and JDK >= 17,
# and caps compileSdk at API 37.
agp = "9.4.0"
kotlin = "2.4.20"

# Android platform. minSdk 26 is what gives us java.time without desugaring, which is the
# reason :core needs no date library.
compileSdk = "37"
compileSdkMinor = "1"
minSdk = "26"
targetSdk = "37"

# The app's own version — the one a release is tagged with and the one a downloaded APK reports
# under Settings > Apps. `appVersionName` is the human one and must match the `vX.Y.Z` git tag a
# release is cut from; .github/workflows/release.yml refuses to build if the two disagree, which
# is what stops a tag saying one thing and the installed app another. `appVersionCode` is the
# integer Android compares when deciding whether an APK is an upgrade, so it only ever goes up —
# including for a release that changes nothing else.
appVersionName = "0.1.0"
appVersionCode = "1"

# :api — the tRPC transport. OkHttp stands in for URLSession, kotlinx-serialization for Codable.
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"

# Tests. JUnit 6 on the JUnit Platform, run by Gradle's useJUnitPlatform().
junit = "6.1.3"
# The instrumented suite, which runs on a device and therefore on JUnit4 + AndroidJUnitRunner
# rather than the JUnit Platform the JVM suites use. Compose's own test artifact takes its
# version from the Compose BOM, like every other Compose dependency here.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# :app — Compose and the AndroidX pieces around it.
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.1"
lifecycle = "2.11.0"
datastore = "1.2.1"
coreKtx = "1.19.0"

[libraries]
# --- :api ---------------------------------------------------------------------------------
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# --- tests --------------------------------------------------------------------------------
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# Versioned with OkHttp itself, so it always speaks the same HTTP stack the client does.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

# --- :app ---------------------------------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# viewModelScope — used by Part 10's ViewModels to launch their suspend work.
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Compose artifacts carry no version: the BOM below decides them, so a Compose upgrade is one
# line (composeBom) rather than eight.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
# There is deliberately no `kotlin-android` alias. AGP 9 compiles Kotlin itself and applying
# `org.jetbrains.kotlin.android` alongside it is a hard build failure, not a deprecation
# warning. :app therefore applies only the two below. `kotlin-jvm` is still needed — and only
# needed — by :api and :core, which have no AGP to bring Kotlin with it.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
